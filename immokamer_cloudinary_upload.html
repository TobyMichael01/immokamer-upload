<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImmoKamer — Téléverser une photo</title>
<script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
<style>
  body {
    font-family: -apple-system, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f5f5f5;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  h2 { color: #0F6E56; }
  button {
    background: #0F6E56;
    color: white;
    border: none;
    padding: 16px 32px;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 16px;
  }
  #status { margin-top: 20px; color: #555; }
  #preview { max-width: 240px; margin-top: 16px; border-radius: 8px; }
</style>
</head>
<body>

<h2>ImmoKamer</h2>
<p>Appuyez sur le bouton pour choisir une photo</p>
<button id="upload_btn">Choisir une photo</button>
<div id="status"></div>
<img id="preview" style="display:none;" />

<script>
  // ── CONFIGURATION ──
  const CLOUD_NAME = "z25nh0mn";
  const UPLOAD_PRESET = "immokamer_uploads";
  // The base URL Glide should redirect back to after upload.
  // Replace this with the exact screen URL from your Glide app if you want
  // the redirect to land on a specific screen (see instructions below).
  const GLIDE_RETURN_URL = "https://immokamer-7a2n.glide.page";

  const myWidget = cloudinary.createUploadWidget(
    {
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      sources: ['local', 'camera'],
      multiple: false,
      maxFileSize: 10000000, // 10MB
      language: 'fr',
      text: {
        fr: {
          menu: { files: "Mes fichiers", camera: "Appareil photo" },
          local: { browse: "Parcourir", dd_title_single: "Glissez une photo ici" }
        }
      }
    },
    (error, result) => {
      if (!error && result && result.event === "success") {
        const imageUrl = result.info.secure_url;
        document.getElementById('status').innerText = "Téléversement réussi ! Redirection...";
        document.getElementById('preview').src = imageUrl;
        document.getElementById('preview').style.display = 'block';

        // Redirect back to Glide with the URL as a query parameter
        setTimeout(() => {
          const redirectUrl = GLIDE_RETURN_URL + "?photo_url=" + encodeURIComponent(imageUrl);
          window.location.href = redirectUrl;
        }, 1200);
      } else if (error) {
        document.getElementById('status').innerText = "Erreur lors du téléversement. Veuillez réessayer.";
      }
    }
  );

  document.getElementById("upload_btn").addEventListener("click", () => {
    myWidget.open();
  });
</script>

</body>
</html>
